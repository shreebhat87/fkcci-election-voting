<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slip Verification — FKCCI Election</title>
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  body { background: var(--navy-900); }
  .verify-wrap { max-width: 440px; margin: 0 auto; padding: 24px 16px 48px; }
  .verify-banner { border-radius: var(--radius-lg); padding: 28px 22px; text-align: center; color: #fff; margin-bottom: 18px; }
  .verify-banner .icon { font-size: 46px; margin-bottom: 8px; }
  .verify-banner.ok { background: linear-gradient(135deg, #1f9d55, #177a42); }
  .verify-banner.bad { background: linear-gradient(135deg, #c0392b, #8f2a20); }
  .verify-banner.void { background: linear-gradient(135deg, #b7791f, #8f5d13); }
  .verify-card { background: #fff; border-radius: var(--radius-lg); padding: 22px; box-shadow: var(--shadow-lg); }
  .try-links { margin-top: 20px; text-align: center; }
  .try-links a { color: #cbd6e8; font-size: 12.5px; display: inline-block; margin: 3px 8px; }
</style>
</head>
<body>
<div class="proto-banner">🧪 Interactive Prototype — simulates what a hall entry staff member sees after scanning a voter's slip QR code.</div>

<div class="verify-wrap">
  <div class="text-center" style="margin: 18px 0 20px;">
    <div class="brand-mark" style="margin:0 auto 10px;">FK</div>
    <h2 style="color:#fff;">Voting Slip Verification</h2>
    <p style="color:#b8c4da;">FKCCI Election 2026</p>
  </div>

  <div id="resultArea"></div>

  <div class="try-links no-print">
    <a href="?slip=FKCCI%2F2026%2F999999">Try invalid slip</a>
    <a href="index.html">← Back to login</a>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/qr.js"></script>
<script src="assets/js/photo.js"></script>
<script>
function initials(name){return name.split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();}

const params = new URLSearchParams(window.location.search);
let slipSerial = params.get("slip");

// If no slip param given, default to the most recent issued vote so the
// demo shows something meaningful straight away.
if (!slipSerial) {
  const votes = FKCCI.getAllVotes();
  slipSerial = votes.length ? votes[0].serial : null;
}

const area = document.getElementById("resultArea");
const record = slipSerial ? FKCCI.findVoteBySerial(slipSerial) : null;

if (!record) {
  area.innerHTML = `
    <div class="verify-banner bad">
      <div class="icon">✕</div>
      <h3 style="color:#fff;">Slip Not Found</h3>
      <p style="color:#fdeceb;">This QR code does not match any issued voting slip.</p>
    </div>`;
} else if (record.status === "void") {
  const member = FKCCI.findMemberByRFID(record.rfid);
  area.innerHTML = `
    <div class="verify-banner void">
      <div class="icon">⚠</div>
      <h3 style="color:#fff;">Slip Voided</h3>
      <p style="color:#fbf0d9;">This slip was cancelled by an administrator and is no longer valid.</p>
    </div>
    <div class="verify-card">
      <div class="flex gap-12" style="align-items:center;">
        ${member && member.hasPhoto
          ? `<div class="photo-avatar avatar-lg" style="opacity:.6;"><canvas id="verifyPhoto"></canvas></div>`
          : `<div class="avatar avatar-lg" style="background:#8592a3;">${initials(record.name)}</div>`}
        <div>
          <h3>${record.name}</h3>
          <p>${record.company}</p>
        </div>
      </div>
      <div class="mt-16" style="font-size:13px;">
        <div class="flex-between mt-8"><span class="text-muted">Slip No.</span><strong>${record.serial}</strong></div>
        <div class="flex-between mt-8"><span class="text-muted">Void reason</span><strong>${record.voidReason || "—"}</strong></div>
      </div>
    </div>`;
  if (member && member.hasPhoto) renderPersonPhoto(document.getElementById("verifyPhoto"), member.memberId, 84);
} else {
  const member = FKCCI.findMemberByRFID(record.rfid);
  area.innerHTML = `
    <div class="verify-banner ok">
      <div class="icon">✓</div>
      <h3 style="color:#fff;">Valid Voting Slip</h3>
      <p style="color:#e3f8ec;">Issued by FKCCI Election System</p>
    </div>
    <div class="verify-card">
      <div class="flex gap-12" style="align-items:center;">
        ${member && member.hasPhoto
          ? `<div class="photo-avatar avatar-lg"><canvas id="verifyPhoto"></canvas></div>`
          : `<div class="avatar avatar-lg" style="background:${member ? member.color : '#1d4e89'};">${initials(record.name)}</div>`}
        <div>
          <h3>${record.name}</h3>
          <p>${record.designation} · ${record.company}</p>
          ${!(member && member.hasPhoto) ? `<p class="no-photo-note">📷 No photo on file</p>` : ""}
        </div>
      </div>
      <div class="mt-16" style="font-size:13px;">
        <div class="flex-between mt-8"><span class="text-muted">Member ID</span><strong>${record.memberId}</strong></div>
        <div class="flex-between mt-8"><span class="text-muted">Company</span><strong style="text-align:right; max-width:220px;">${record.company}</strong></div>
        <div class="flex-between mt-8"><span class="text-muted">Slip No.</span><strong>${record.serial}</strong></div>
        <div class="flex-between mt-8"><span class="text-muted">Issued at</span><strong>Counter ${record.counter}, ${FKCCI.formatTime(record.timestamp)}</strong></div>
      </div>
    </div>`;
  if (member && member.hasPhoto) renderPersonPhoto(document.getElementById("verifyPhoto"), member.memberId, 84);
}
</script>
</body>
</html>
